<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐剧灵魂测试 ✦ Musical Soul</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+SC:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,400&family=Ma+Shan+Zheng&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --gold: #d4af37;
  --gold-light: #f0d060;
  --deep-purple: #1a0a2e;
  --dark: #0d0d1a;
  --darker: #08080f;
  --crimson: #8b0000;
  --rose: #c0556a;
  --teal: #2a7c6f;
  --text-light: #f0e8d0;
  --text-dim: #9a8870;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--darker);
  color: var(--text-light);
  font-family: 'Noto Serif SC', 'Georgia', serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(212,175,55,0.04) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, rgba(139,0,0,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(26,10,46,0.8) 0%, transparent 100%);
  pointer-events: none; z-index: 0;
}
#stars { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.star {
  position: absolute; background: #fff; border-radius: 50%;
  animation: twinkle var(--dur, 3s) ease-in-out infinite;
}
@keyframes twinkle {
  0%,100% { opacity: 0.1; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.3); }
}
.screen {
  position: relative; z-index: 1;
  min-height: 100vh; width: 100%;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem;
  animation: fadeIn 0.6s ease;
}
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* ── INTRO ── */
#intro { text-align: center; }
.curtain-left, .curtain-right {
  position: fixed; top: 0; width: 48%; height: 100vh;
  background: linear-gradient(to bottom, #1a0010, #3d0020, #1a0010);
  z-index: 10; transition: transform 1.2s cubic-bezier(0.77,0,0.18,1);
}
.curtain-left { left: 0; transform: translateX(-72%); }
.curtain-right { right: 0; transform: translateX(72%); }
.curtain-left.open { transform: translateX(-100%); }
.curtain-right.open { transform: translateX(100%); }
.curtain-left::after, .curtain-right::after {
  content: '';
  position: absolute; top: 0; bottom: 0; width: 12px;
  background: repeating-linear-gradient(to bottom, rgba(212,175,55,0.3) 0px, rgba(212,175,55,0.1) 20px, rgba(212,175,55,0.3) 40px);
}
.curtain-left::after { right: 0; }
.curtain-right::after { left: 0; }
.curtain-fringe {
  position: fixed; top: 0; left: 0; right: 0; height: 60px;
  background: linear-gradient(to right, #2a0015, #4a0025, #3a001a, #4a0025, #2a0015);
  z-index: 11; border-bottom: 3px solid var(--gold);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.8s ease;
}
.curtain-fringe.hidden { transform: translateY(-100%); }
.fringe-drop {
  width: 3px; height: 40px;
  background: linear-gradient(to bottom, var(--gold), transparent);
  border-radius: 2px;
}
.logo-area { margin-bottom: 2rem; }
.logo-icon { font-size: 4rem; display: block; margin-bottom: 0.5rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.5)); }
.site-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.2rem, 6vw, 4rem); font-style: italic;
  background: linear-gradient(135deg, var(--gold-light), var(--gold), #b8860b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1.2;
}
.site-subtitle {
  font-family: 'Cormorant Garamond', serif;
  font-size: 1rem; letter-spacing: 0.3em;
  color: var(--text-dim); margin-top: 0.5rem; text-transform: uppercase;
}
.divider { display: flex; align-items: center; gap: 1rem; margin: 1.5rem auto; max-width: 400px; }
.divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
.divider-icon { color: var(--gold); font-size: 1rem; }
.intro-desc { max-width: 560px; margin: 0 auto 2rem; font-size: 1.05rem; line-height: 1.9; color: #c8b89a; }
.stat-row { display: flex; gap: 2rem; justify-content: center; margin: 1.5rem 0 2.5rem; flex-wrap: wrap; }
.stat-item { text-align: center; }
.stat-num { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--gold); display: block; }
.stat-label { font-size: 0.78rem; color: var(--text-dim); letter-spacing: 0.1em; }
.btn-start {
  position: relative;
  background: linear-gradient(135deg, #8b0000, #c0191f, #8b0000);
  border: 2px solid var(--gold); color: var(--gold-light);
  font-family: 'Playfair Display', serif; font-size: 1.25rem; font-style: italic;
  padding: 1rem 3rem; border-radius: 4px; cursor: pointer;
  letter-spacing: 0.1em; transition: all 0.3s ease; overflow: hidden;
}
.btn-start::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent, rgba(212,175,55,0.15), transparent);
  transform: translateX(-100%); transition: transform 0.5s ease;
}
.btn-start:hover::before { transform: translateX(100%); }
.btn-start:hover { box-shadow: 0 0 30px rgba(212,175,55,0.4); transform: translateY(-2px); }

/* ── QUIZ ── */
#quiz { padding: 5rem 1.5rem 2rem; justify-content: flex-start; }
.quiz-header {
  position: fixed; top: 0; left: 0; right: 0;
  background: rgba(8,8,15,0.95); backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(212,175,55,0.2);
  padding: 0.8rem 2rem; z-index: 100;
  display: flex; align-items: center; gap: 1.5rem;
}
.quiz-logo { font-size: 1.2rem; white-space: nowrap; color: var(--gold); font-family: 'Playfair Display', serif; font-style: italic; }
.progress-bar-wrap { flex: 1; }
.progress-label { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 4px; letter-spacing: 0.1em; }
.progress-track { height: 4px; background: rgba(212,175,55,0.15); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(to right, var(--crimson), var(--gold)); border-radius: 2px; transition: width 0.5s ease; }
.q-counter { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 0.9rem; white-space: nowrap; }
.question-card { max-width: 680px; width: 100%; margin-top: 1rem; animation: slideIn 0.5s ease; }
@keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
.q-number {
  font-family: 'Cormorant Garamond', serif;
  font-size: 0.85rem; letter-spacing: 0.3em;
  color: var(--gold); opacity: 0.7; margin-bottom: 1rem; text-transform: uppercase;
}
.q-text {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(1.1rem, 3vw, 1.35rem); line-height: 1.7; color: var(--text-light);
  margin-bottom: 2rem; padding-bottom: 1.2rem;
  border-bottom: 1px solid rgba(212,175,55,0.15);
}
.options { display: flex; flex-direction: column; gap: 0.9rem; }
.option-btn {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(212,175,55,0.2); color: var(--text-light);
  padding: 1rem 1.4rem; border-radius: 6px; cursor: pointer;
  text-align: left; font-family: 'Noto Serif SC', serif;
  font-size: 0.95rem; line-height: 1.6;
  transition: all 0.25s ease; display: flex; align-items: flex-start; gap: 0.8rem;
  position: relative; overflow: hidden;
}
.option-btn::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--gold); transform: scaleY(0); transition: transform 0.3s ease;
}
.option-btn:hover { background: rgba(212,175,55,0.08); border-color: rgba(212,175,55,0.5); transform: translateX(4px); }
.option-btn:hover::before { transform: scaleY(1); }
.option-btn.selected { background: rgba(212,175,55,0.12); border-color: var(--gold); color: var(--gold-light); }
.option-btn.selected::before { transform: scaleY(1); }
.option-letter { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--gold); font-weight: 700; min-width: 24px; opacity: 0.8; }
.option-text { flex: 1; }
.quiz-nav { margin-top: 2rem; display: flex; justify-content: space-between; align-items: center; }
.btn-prev {
  background: transparent; border: 1px solid rgba(212,175,55,0.35); color: var(--text-dim);
  padding: 0.7rem 1.5rem; border-radius: 4px; cursor: pointer;
  font-family: 'Playfair Display', serif; font-size: 0.9rem; font-style: italic;
  letter-spacing: 0.05em; transition: all 0.3s ease; opacity: 0; pointer-events: none;
}
.btn-prev.visible { opacity: 1; pointer-events: auto; }
.btn-prev:hover { border-color: var(--gold); color: var(--gold); }
.btn-next {
  background: transparent; border: 1px solid var(--gold); color: var(--gold);
  padding: 0.7rem 2rem; border-radius: 4px; cursor: pointer;
  font-family: 'Playfair Display', serif; font-size: 0.95rem; font-style: italic;
  letter-spacing: 0.1em; transition: all 0.3s ease; opacity: 0; pointer-events: none;
}
.btn-next.visible { opacity: 1; pointer-events: auto; }
.btn-next:hover { background: rgba(212,175,55,0.1); box-shadow: 0 0 20px rgba(212,175,55,0.2); }

/* ── LOADING ── */
#loading { text-align: center; }
.loading-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-style: italic; color: var(--gold); margin-bottom: 2rem; }
.crystal-ball { font-size: 5rem; animation: float 2s ease-in-out infinite; display: block; margin: 0 auto 2rem; filter: drop-shadow(0 0 20px rgba(212,175,55,0.6)); }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
.loading-text { color: var(--text-dim); font-size: 0.9rem; letter-spacing: 0.2em; animation: pulse 1.5s ease infinite; }
@keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }

/* ── RESULT ── */
#result { padding: 2rem 1.5rem; }
.result-card {
  max-width: 700px; width: 100%;
  background: rgba(10,8,20,0.9);
  border: 1px solid rgba(212,175,55,0.3); border-radius: 12px; overflow: hidden;
  box-shadow: 0 0 60px rgba(212,175,55,0.1), 0 0 120px rgba(139,0,0,0.1);
  animation: revealCard 0.8s ease;
}
@keyframes revealCard { from { opacity: 0; transform: scale(0.9) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.result-header {
  padding: 2.5rem 2.5rem 2rem; border-bottom: 1px solid rgba(212,175,55,0.15);
  text-align: center; position: relative; overflow: hidden;
}
.result-header::before { content: ''; position: absolute; inset: 0; background: var(--char-gradient); opacity: 0.4; }
.result-header > * { position: relative; z-index: 1; }
.result-you-are { font-family: 'Cormorant Garamond', serif; font-size: 0.85rem; letter-spacing: 0.4em; color: var(--gold); opacity: 0.8; text-transform: uppercase; margin-bottom: 0.5rem; }
/* calligraphy replaces emoji */
.char-calligraphy { margin: 1rem 0; text-align: center; }
.char-calli-zh {
  font-family: 'Ma Shan Zheng', '华文行楷', 'STKaiti', cursive;
  font-size: clamp(2.6rem, 8vw, 3.8rem);
  background: linear-gradient(135deg, #f0d060, #d4af37, #b8860b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  display: block; line-height: 1.25;
  filter: drop-shadow(0 0 12px rgba(212,175,55,0.35));
}
.char-calli-en {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(1.3rem, 4vw, 1.8rem);
  color: rgba(212,175,55,0.55);
  display: block; margin-top: -0.2rem;
}
.result-char-name {
  font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 5vw, 2.8rem);
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height: 1.2; margin-bottom: 0.4rem;
}
.result-musical { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-style: italic; color: #c8b89a; }
.result-body { padding: 2rem 2.5rem; }
.song-box {
  background: rgba(212,175,55,0.06); border: 1px solid rgba(212,175,55,0.2);
  border-radius: 8px; padding: 1.2rem 1.5rem; margin-bottom: 1.8rem;
  display: flex; align-items: center; gap: 1rem;
}
.song-icon { font-size: 1.8rem; }
.song-label { font-size: 0.7rem; letter-spacing: 0.2em; color: var(--text-dim); text-transform: uppercase; margin-bottom: 0.2rem; }
.song-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-style: italic; color: var(--gold-light); }
.song-name-cn { font-size: 0.85rem; color: var(--text-dim); margin-top: 0.1rem; }
.result-desc { font-size: 0.98rem; line-height: 1.9; color: #c8b89a; margin-bottom: 1.8rem; }
.result-quote {
  font-family: 'Cormorant Garamond', serif; font-size: 1.05rem; font-style: italic;
  color: var(--gold); opacity: 0.8; border-left: 3px solid var(--gold);
  padding-left: 1rem; margin-bottom: 2rem; line-height: 1.7;
}
.quote-orig {
  display: block; margin-top: 0.5rem;
  font-family: 'Cormorant Garamond', serif; font-size: 0.88rem; font-style: italic;
  color: rgba(212,175,55,0.5); letter-spacing: 0.02em;
}
.traits-row { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 2rem; }
.trait-tag {
  background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3);
  color: var(--gold-light); padding: 0.3rem 0.8rem; border-radius: 20px;
  font-size: 0.78rem; letter-spacing: 0.05em;
}
.result-footer {
  border-top: 1px solid rgba(212,175,55,0.15); padding: 1.5rem 2.5rem;
  display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
}
.btn-retry {
  background: transparent; border: 1px solid var(--gold); color: var(--gold);
  padding: 0.7rem 1.8rem; border-radius: 4px; cursor: pointer;
  font-family: 'Playfair Display', serif; font-size: 0.95rem; font-style: italic;
  transition: all 0.3s ease;
}
.btn-retry:hover { background: rgba(212,175,55,0.1); }
.btn-share {
  background: linear-gradient(135deg, #8b0000, #c0191f); border: 1px solid var(--gold);
  color: var(--gold-light); padding: 0.7rem 1.8rem; border-radius: 4px; cursor: pointer;
  font-family: 'Playfair Display', serif; font-size: 0.95rem; font-style: italic;
  transition: all 0.3s ease;
}
.btn-share:hover { box-shadow: 0 0 20px rgba(212,175,55,0.3); transform: translateY(-1px); }
.spotlight {
  position: fixed; top: -50%; left: 50%; transform: translateX(-50%);
  width: 300px; height: 150vh;
  background: radial-gradient(ellipse at top, rgba(212,175,55,0.04) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}
.toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(100px);
  background: rgba(10,8,20,0.95); border: 1px solid var(--gold);
  color: var(--gold-light); padding: 0.8rem 1.5rem; border-radius: 4px; font-size: 0.9rem;
  transition: transform 0.4s ease; z-index: 999;
}
.toast.show { transform: translateX(-50%) translateY(0); }
/* ── RADAR CHART ── */
.radar-section { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(212,175,55,0.1); }
.radar-title {
  font-family: 'Cormorant Garamond', serif; font-size: 0.78rem;
  letter-spacing: 0.35em; color: var(--text-dim); text-transform: uppercase;
  text-align: center; margin-bottom: 1rem;
}
.radar-title em { font-style: italic; color: var(--gold); opacity: 0.7; }
.radar-container { display: flex; justify-content: center; padding: 24px; overflow: visible; }

/* ── SHARE MODAL ── */
.share-modal {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center;
  padding: 1rem;
}
.share-modal.visible { display: flex; }
.share-modal-inner {
  display: flex; flex-direction: column; align-items: center;
  gap: 1rem; max-height: 95vh;
}
.share-card-wrap {
  overflow-y: auto; max-height: 75vh;
  border: 1px solid rgba(212,175,55,0.3); border-radius: 8px;
  scrollbar-width: thin; scrollbar-color: rgba(212,175,55,0.3) transparent;
}
.share-actions { display: flex; gap: 0.8rem; }
.btn-dl {
  background: linear-gradient(135deg, #8b0000, #c0191f); border: 1px solid var(--gold);
  color: var(--gold-light); padding: 0.6rem 1.5rem; border-radius: 4px; cursor: pointer;
  font-family: 'Playfair Display', serif; font-size: 0.9rem; font-style: italic;
  transition: all 0.3s ease;
}
.btn-dl:hover { box-shadow: 0 0 20px rgba(212,175,55,0.3); }
.btn-dl:disabled { opacity: 0.5; cursor: wait; }
.btn-close-modal {
  background: transparent; border: 1px solid rgba(212,175,55,0.4); color: var(--text-dim);
  padding: 0.6rem 1.2rem; border-radius: 4px; cursor: pointer;
  font-family: 'Playfair Display', serif; font-size: 0.9rem; font-style: italic;
}
.share-hint { font-size: 0.72rem; color: var(--text-dim); letter-spacing: 0.05em; }

@media (max-width: 600px) {
  .result-body { padding: 1.5rem; }
  .result-header { padding: 2rem 1.5rem 1.5rem; }
  .result-footer { padding: 1rem 1.5rem; }
  .quiz-logo { display: none; }
  .share-card-wrap { max-height: 65vh; }
}
</style>
</head>
<body>
<div id="stars"></div>
<div class="spotlight"></div>
<div class="curtain-fringe" id="curtainFringe">
  <div class="fringe-drop"></div><div class="fringe-drop"></div><div class="fringe-drop"></div>
  <div class="fringe-drop"></div><div class="fringe-drop"></div><div class="fringe-drop"></div>
  <div class="fringe-drop"></div><div class="fringe-drop"></div><div class="fringe-drop"></div>
  <div class="fringe-drop"></div><div class="fringe-drop"></div><div class="fringe-drop"></div>
  <div class="fringe-drop"></div><div class="fringe-drop"></div><div class="fringe-drop"></div>
</div>
<div class="curtain-left" id="curtainL"></div>
<div class="curtain-right" id="curtainR"></div>

<!-- SCREEN 1: INTRO -->
<div class="screen active" id="intro">
  <div class="logo-area">
    <span class="logo-icon">🎭</span>
    <h1 class="site-title">Musical Soul</h1>
    <p class="site-subtitle">音乐剧灵魂测试</p>
  </div>
  <div class="divider">
    <div class="divider-line"></div><span class="divider-icon">✦</span><div class="divider-line"></div>
  </div>
  <p class="intro-desc">
    每一部音乐剧里，都住着一个可能的你。<br>
    25道题，揭开你内心深处的音乐剧灵魂——<br>
    你是谁？你的本命曲目是哪一首？
  </p>
  <div class="stat-row">
    <div class="stat-item"><span class="stat-num">25</span><span class="stat-label">道题目</span></div>
    <div class="stat-item"><span class="stat-num">48</span><span class="stat-label">种结果</span></div>
    <div class="stat-item"><span class="stat-num">5 min</span><span class="stat-label">完成时间</span></div>
  </div>
  <button class="btn-start" onclick="startQuiz()">✦ 开幕 · Begin ✦</button>
</div>

<!-- SCREEN 2: QUIZ -->
<div class="screen" id="quiz">
  <div class="quiz-header">
    <div class="quiz-logo">🎭 Musical Soul</div>
    <div class="progress-bar-wrap">
      <div class="progress-label">幕布拉开 · <span id="progressPct">0</span>%</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="q-counter">第 <span id="qNum">1</span> / <span id="qTotal">25</span> 题</div>
  </div>
  <div class="question-card" id="questionCard">
    <div class="q-number" id="qNumber">幕 · 一</div>
    <div class="q-text" id="qText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="quiz-nav">
      <button class="btn-prev" id="btnPrev" onclick="prevQuestion()">← 上一幕</button>
      <button class="btn-next" id="btnNext" onclick="nextQuestion()">下一幕 →</button>
    </div>
  </div>
</div>

<!-- SCREEN 3: LOADING -->
<div class="screen" id="loading">
  <span class="crystal-ball">🔮</span>
  <div class="loading-title">命运之书正在翻阅……</div>
  <div class="loading-text">✦ &nbsp; INTERMISSION &nbsp; ✦</div>
</div>

<!-- SCREEN 4: RESULT -->
<div class="screen" id="result">
  <div class="result-card" id="resultCard">
    <div class="result-header" id="resultHeader">

// QUIZ STATE
// ═══════════════════════════════════════════════════
let currentQ = 0;
let scores = {};
let dims = {ext:0,ide:0,emo:0,reb:0,amb:0,sel:0};
let dimMax = {ext:0,ide:0,emo:0,reb:0,amb:0,sel:0};
let selectedOption = null;
let selections = []; // selections[i] = chosen option index for question i
const DIM_KEYS = ['ext','ide','emo','reb','amb','sel'];

function initScores() {
  scores = {};
  Object.keys(characters).forEach(k => scores[k] = 0);
  dims = {ext:0,ide:0,emo:0,reb:0,amb:0,sel:0};
  selections = [];
}

function computeDimMax() {
  dimMax = {ext:0,ide:0,emo:0,reb:0,amb:0,sel:0};
  questions.forEach(q => {
    const best = {ext:0,ide:0,emo:0,reb:0,amb:0,sel:0};
    q.opts.forEach(o => {
      if (!o.d) return;
      DIM_KEYS.forEach(k => { if ((o.d[k]||0) > best[k]) best[k] = o.d[k]; });
    });
    DIM_KEYS.forEach(k => dimMax[k] += best[k]);
  });
}

// ─── STARS ───
function generateStars() {
  const container = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    star.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--dur:${2+Math.random()*4}s;animation-delay:${Math.random()*4}s;`;
    container.appendChild(star);
  }
}

// ─── SCREEN ───
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ─── START ───
function startQuiz() {
  initScores();
  currentQ = 0;
  document.getElementById('qTotal').textContent = questions.length;
  document.getElementById('curtainL').classList.add('open');
  document.getElementById('curtainR').classList.add('open');
  document.getElementById('curtainFringe').classList.add('hidden');
  setTimeout(() => { showScreen('quiz'); renderQuestion(); }, 800);
}

// ─── RENDER QUESTION ───
function renderQuestion() {
  const q = questions[currentQ];
  selectedOption = null;

  document.getElementById('qNum').textContent = currentQ + 1;
  const pct = Math.round((currentQ / questions.length) * 100);
  document.getElementById('progressPct').textContent = pct;
  document.getElementById('progressFill').style.width = pct + '%';

  const acts = ['一','二','三','四','五','六','七','八','九','十',
                 '十一','十二','十三','十四','十五','十六','十七','十八','十九','二十',
                 '二十一','二十二','二十三','二十四','二十五'];
  document.getElementById('qNumber').textContent = `幕 · ${acts[currentQ] || (currentQ+1)}`;
  document.getElementById('qText').textContent = q.q;

  const letters = ['A','B','C','D'];
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  const btns = [];
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-letter">${letters[i]}</span><span class="option-text">${opt.t}</span>`;
    btn.onclick = () => selectOption(btn, i);
    container.appendChild(btn);
    btns.push(btn);
  });

  // Restore previous selection for this question
  const prevSel = selections[currentQ];
  if (prevSel !== undefined && prevSel !== null) {
    selectedOption = prevSel;
    btns[prevSel].classList.add('selected');
  } else {
    selectedOption = null;
  }

  const btnNext = document.getElementById('btnNext');
  btnNext.classList.toggle('visible', selectedOption !== null);
  btnNext.textContent = currentQ === questions.length - 1 ? '揭晓结果 ✦' : '下一幕 →';

  const btnPrev = document.getElementById('btnPrev');
  btnPrev.classList.toggle('visible', currentQ > 0);

  const card = document.getElementById('questionCard');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'slideIn 0.5s ease';
}

// ─── SELECT OPTION ───
function selectOption(btn, index) {
  const q = questions[currentQ];
  // Remove previous selection's scores
  if (selectedOption !== null) {
    const prev = q.opts[selectedOption];
    Object.entries(prev.s).forEach(([c,p]) => { if (scores[c]!==undefined) scores[c]-=p; });
    if (prev.d) DIM_KEYS.forEach(k => { dims[k] -= (prev.d[k]||0); });
  }
  document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  selectedOption = index;
  const cur = q.opts[index];
  Object.entries(cur.s).forEach(([c,p]) => { if (scores[c]!==undefined) scores[c]+=p; });
  if (cur.d) DIM_KEYS.forEach(k => { dims[k] += (cur.d[k]||0); });
  selections[currentQ] = index;
  document.getElementById('btnNext').classList.add('visible');
}

// ─── NEXT QUESTION ───
function nextQuestion() {
  if (selectedOption === null) return;
  currentQ++;
  if (currentQ >= questions.length) {
    showResult();
  } else {
    // If going to a previously-answered question (was subtracted when backing up), re-add its scores
    const prevSel = selections[currentQ];
    if (prevSel !== undefined && prevSel !== null) {
      const opt = questions[currentQ].opts[prevSel];
      Object.entries(opt.s).forEach(([c,p]) => { if (scores[c]!==undefined) scores[c]+=p; });
      if (opt.d) DIM_KEYS.forEach(k => { dims[k] += (opt.d[k]||0); });
    }
    renderQuestion();
  }
}

// ─── PREV QUESTION ───
function prevQuestion() {
  if (currentQ === 0) return;
  // Subtract current question's scores before going back
  if (selectedOption !== null) {
    const opt = questions[currentQ].opts[selectedOption];
    Object.entries(opt.s).forEach(([c,p]) => { if (scores[c]!==undefined) scores[c]-=p; });
    if (opt.d) DIM_KEYS.forEach(k => { dims[k] -= (opt.d[k]||0); });
  }
  currentQ--;
  renderQuestion();
}

// ─── SHOW RESULT ───
function showResult() {
  showScreen('loading');
  setTimeout(() => {
    // Normalize by max possible score so characters appearing in fewer questions aren't penalized
    const maxPoss = {};
    Object.keys(characters).forEach(k => maxPoss[k] = 0);
    questions.forEach(q => {
      const qBest = {};
      q.opts.forEach(o => { Object.entries(o.s).forEach(([c,p]) => { qBest[c] = Math.max(qBest[c]||0, p); }); });
      Object.entries(qBest).forEach(([c,p]) => { if (maxPoss[c]!==undefined) maxPoss[c]+=p; });
    });
    const winner = Object.entries(scores)
      .filter(([c]) => maxPoss[c] > 0)
      .sort((a,b) => (b[1]/maxPoss[b[0]]) - (a[1]/maxPoss[a[0]]))[0][0];
    const char = characters[winner];

    // Calligraphy
    document.getElementById('resCalliZH').textContent = char.name;
    document.getElementById('resCalliEN').textContent = char.nameEN;
    document.getElementById('resName').textContent = char.musical;
    document.getElementById('resMusical').textContent = '';
    document.getElementById('resSong').textContent = char.song;
    document.getElementById('resSongCN').textContent = char.songCN;
    document.getElementById('resDesc').textContent = char.desc;
    document.getElementById('resQuote').innerHTML =
      char.quote + (char.quoteOrig ? `<em class="quote-orig">${char.quoteOrig}</em>` : '');

    const traitsEl = document.getElementById('resTraits');
    traitsEl.innerHTML = char.traits.map(t => `<span class="trait-tag">${t}</span>`).join('');

    document.getElementById('resultHeader').style.background = char.gradient;
    document.getElementById('progressPct').textContent = '100';
    document.getElementById('progressFill').style.width = '100%';

    // Radar chart
    const nd = getNormalizedDims();
    document.getElementById('radarContainer').innerHTML = createRadarSVG(nd, 300);

    window._resultChar = char;
    window._normDims = nd;
    showScreen('result');
  }, 2500);
}

// ─── DIMENSION NORMALIZATION ───
function getNormalizedDims() {
  const r = {};
  DIM_KEYS.forEach(k => {
    r[k] = dimMax[k] > 0 ? Math.min(100, Math.round(dims[k] / dimMax[k] * 100)) : 20;
  });
  return r;
}

// ─── RADAR CHART SVG ───
function createRadarSVG(nd, size) {
  const G = '#d4af37', GL = '#f0d060', GD = 'rgba(212,175,55,0.18)', TC = 'rgba(240,232,208,0.82)';
  const labels = ['外向力','理想度','情感力','反叛值','野心度','奉献心'];
  const vals = DIM_KEYS.map(k => (nd[k]||0) / 100);
  const pad = 36;
  const n = 6, cx = size/2, cy = size/2, r = size*0.30, lr = r + size*0.155;
  const step = Math.PI*2/n, start = -Math.PI/2;
  const pt = (ratio, i) => {
    const a = start + i*step;
    return [cx + r*ratio*Math.cos(a), cy + r*ratio*Math.sin(a)];
  };
  const grids = [.2,.4,.6,.8,1].map(ratio => {
    const p = Array.from({length:n},(_,i) => pt(ratio,i).map(v=>v.toFixed(1)).join(',')).join(' ');
    return `<polygon points="${p}" fill="none" stroke="${GD}" stroke-width="1"/>`;
  }).join('');
  const axes = Array.from({length:n},(_,i) => {
    const [x,y] = pt(1,i);
    return `<line x1="${cx.toFixed(1)}" y1="${cy.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${GD}" stroke-width="1"/>`;
  }).join('');
  const dataPts = vals.map((v,i) => pt(v,i).map(x=>x.toFixed(1)).join(',')).join(' ');
  const dots = vals.map((v,i) => {
    const [x,y] = pt(v,i);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="${G}" opacity="0.9"/>`;
  }).join('');
  const fs = size > 240 ? 12 : 10;
  const lbls = labels.map((lbl,i) => {
    const a = start+i*step;
    const lx = cx+lr*Math.cos(a), ly = cy+lr*Math.sin(a);
    const score = Math.round(vals[i]*100);
    const anchor = lx < cx-8 ? 'end' : lx > cx+8 ? 'start' : 'middle';
    return `<text x="${lx.toFixed(1)}" y="${(ly-6).toFixed(1)}" text-anchor="${anchor}" style="font-family:Noto Serif SC,serif;font-size:${fs}px;fill:${TC};">${lbl}</text>
<text x="${lx.toFixed(1)}" y="${(ly+9).toFixed(1)}" text-anchor="${anchor}" style="font-family:Playfair Display,serif;font-size:${fs+1}px;font-style:italic;fill:${G};">${score}</text>`;
  }).join('');
  return `<svg viewBox="${-pad} ${-pad} ${size+pad*2} ${size+pad*2}" width="${size+pad}" height="${size+pad}" xmlns="http://www.w3.org/2000/svg" overflow="visible">
<defs><radialGradient id="rbg${size}"><stop offset="0%" stop-color="rgba(212,175,55,0.06)"/><stop offset="100%" stop-color="rgba(8,8,15,0.4)"/></radialGradient>
<linearGradient id="rfill${size}" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="rgba(212,175,55,0.28)"/><stop offset="100%" stop-color="rgba(139,0,0,0.22)"/></linearGradient></defs>
<circle cx="${cx}" cy="${cy}" r="${(r*1.05).toFixed(1)}" fill="url(#rbg${size})"/>
${grids}${axes}
<polygon points="${dataPts}" fill="url(#rfill${size})" stroke="${G}" stroke-width="1.8" stroke-opacity="0.85"/>
${dots}${lbls}</svg>`;
}

function buildShareCard(char, nd) {
  const radarSVG = createRadarSVG(nd, 190);
  const dimInfo = [{k:'ext',l:'外向力'},{k:'ide',l:'理想度'},{k:'emo',l:'情感力'},{k:'reb',l:'反叛值'},{k:'amb',l:'野心度'},{k:'sel',l:'奉献心'}];
  const bars = dimInfo.map(({k,l}) => {
    const v = nd[k]||0;
    return `<div style="display:flex;align-items:center;gap:5px;margin:3.5px 0;">
<div style="width:38px;font-size:10px;color:#9a8870;text-align:right;font-family:Noto Serif SC,serif;">${l}</div>

async function downloadShareImage() {
  if (typeof html2canvas === 'undefined') { showToast('请联网后重试'); return; }
  const btn = document.getElementById('btnDownload');
  btn.textContent = '生成中…'; btn.disabled = true;
  try {
    await document.fonts.ready;
    const el = document.getElementById('shareCardInner');
    const canvas = await html2canvas(el, {scale:2, backgroundColor:'#08080f', useCORS:true, logging:false});
    const a = document.createElement('a');
    a.download = 'musical-soul-' + (window._resultChar.nameEN||'result').replace(/\s+/g,'-').toLowerCase() + '.png';
    a.href = canvas.toDataURL('image/png',1.0); a.click();
    showToast('下载成功！');
  } catch(e) { showToast('下载失败，请右键另存为'); }
  btn.textContent = '⬇ 下载长图'; btn.disabled = false;
}
